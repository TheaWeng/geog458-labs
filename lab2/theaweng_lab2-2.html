<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cities: Population Patterns</title>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #map-title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1;
            background: white;
            padding: 12px 16px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
            max-width: 320px;
        }

        #map-title h1 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        #map-title p {
            margin: 0;
            font-size: 12px;
            line-height: 1.4;
        }

        #legend {
            position: absolute;
            bottom: 25px;
            left: 15px;
            z-index: 1;
            background: white;
            padding: 12px 15px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            line-height: 1.6;
        }

        .legend-row {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .legend-dot {
            display: inline-block;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .legend-note {
            margin-top: 8px;
            max-width: 220px;
            color: #444;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="map-title">
    <h1>World Cities: Population Patterns</h1>
    <p>Exploring population differences across cities worldwide.</p>
</div>

<div id="legend">
    <strong>City Population</strong>

    <div class="legend-row">
        <span class="legend-dot"
              style="width: 6px; height: 6px; background: #fee8c8;"></span>
        Under 100,000
    </div>

    <div class="legend-row">
        <span class="legend-dot"
              style="width: 10px; height: 10px; background: #fdbb84;"></span>
        100,000–499,999
    </div>

    <div class="legend-row">
        <span class="legend-dot"
              style="width: 16px; height: 16px; background: #e34a33;"></span>
        500,000–999,999
    </div>

    <div class="legend-row">
        <span class="legend-dot"
              style="width: 22px; height: 22px; background: #b30000;"></span>
        1,000,000 or more
    </div>

    <div class="legend-note">
        Larger circles and darker colors represent higher population classes.
        <br>
        Source: Course-provided world cities GeoJSON.
    </div>
</div>

<script>
    // Replace with your Mapbox public access token.
    mapboxgl.accessToken = 'pk.eyJ1IjoidGhlYXdlbmciLCJhIjoiY211enRxdXg1MGE1ZzJ3cHJiY25jd3AzeSJ9.hu6_p9WGMdUXAuteHViv2w';

    // A light basemap keeps the population symbols visible.
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [0, 20],
        zoom: 1.2
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    map.on('load', () => {

        // Load all cities from the provided GeoJSON file.
        map.addSource('world-cities', {
            type: 'geojson',
            data: './data/world-cities.geojson'
        });

        // Population classes use thresholds of 100,000, 500,000,
        // and 1,000,000 to make population differences easier to compare.
        // Larger circles represent higher population classes.
        // Light orange to dark red highlights more populous cities.

        map.addLayer({
            id: 'city-population',
            type: 'circle',
            source: 'world-cities',

            paint: {
                'circle-radius': [
                    'step',
                    ['to-number', ['get', 'population'], 0],
                    3,
                    100000, 5,
                    500000, 8,
                    1000000, 11
                ],

                'circle-color': [
                    'step',
                    ['to-number', ['get', 'population'], 0],
                    '#fee8c8',
                    100000, '#fdbb84',
                    500000, '#e34a33',
                    1000000, '#b30000'
                ],

                'circle-opacity': 0.75,
                'circle-stroke-color': '#ffffff',
                'circle-stroke-width': 0.5
            }
        });

        // Clicking a city displays its name, country, and population.
        map.on('click', 'city-population', (event) => {
            const properties = event.features[0].properties;

            const cityName =
                properties.city || properties.name || 'Unknown city';

            const countryName =
                properties.country || 'Unknown country';

            const population = Number(properties.population);

            const populationText = Number.isFinite(population)
                ? population.toLocaleString()
                : 'Population unavailable';

            new mapboxgl.Popup()
                .setLngLat(event.lngLat)
                .setHTML(
                    `<strong>${cityName}</strong><br>` +
                    `Country: ${countryName}<br>` +
                    `Population: ${populationText}`
                )
                .addTo(map);
        });

        // Show a pointer when hovering over a city.
        map.on('mouseenter', 'city-population', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'city-population', () => {
            map.getCanvas().style.cursor = '';
        });

    });
</script>

</body>
</html>
