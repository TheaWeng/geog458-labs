<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees | Thea Weng</title>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken =
      'pk.eyJ1IjoidGhlYXdlbmciLCJhIjoiY211enRxdXg1MGE1ZzJ3cHJiY25jd3AzeSJ9.hu6_p9WGMdUXAuteHViv2w';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 11,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
      // Step 1.3: Pittsburgh tree source.
      map.setFog({});

      map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson',
        attribution:
          'Pittsburgh street trees: Western Pennsylvania Regional Data Center; map by Thea Weng'
      });

      // Step 1.4: DBH-weighted heatmap.
      map.addLayer({
        id: 'trees-heat',
        type: 'heatmap',
        source: 'trees',
        maxzoom: 15,

        paint: {
          // Retain the tutorial's DBH weighting.
          'heatmap-weight': {
            property: 'dbh',
            type: 'exponential',
            stops: [
              [1, 0],
              [62, 1]
            ]
          },

          // Changed from 1 to 0.6 at comparison zoom 11.
          'heatmap-intensity': {
            stops: [
              [11, 0.6],
              [15, 1.8]
            ]
          },

          // Customized yellow-orange-red color ramp.
          'heatmap-color': [
            'interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(255,255,178,0)',
            0.2, '#ffffb2',
            0.4, '#fecc5c',
            0.6, '#fd8d3c',
            0.8, '#f03b20',
            1, '#bd0026'
          ],

          // Changed from 15 to 8 pixels at comparison zoom 11.
          'heatmap-radius': {
            stops: [
              [11, 8],
              [15, 20]
            ]
          },

          // Retain the transition to individual trees.
          'heatmap-opacity': {
            default: 1,
            stops: [
              [14, 1],
              [15, 0]
            ]
          }
        }
      });

      // Step 1.5: individual trees, drawn above the heatmap.
      map.addLayer({
        id: 'trees-point',
        type: 'circle',
        source: 'trees',
        minzoom: 14,

        paint: {
          'circle-radius': {
            property: 'dbh',
            type: 'exponential',
            stops: [
              [{ zoom: 15, value: 1 }, 5],
              [{ zoom: 15, value: 62 }, 10],
              [{ zoom: 22, value: 1 }, 20],
              [{ zoom: 22, value: 62 }, 50]
            ]
          },

          'circle-color': {
            property: 'dbh',
            type: 'exponential',
            stops: [
              [0, 'rgba(255,255,178,0)'],
              [10, '#ffffb2'],
              [20, '#fecc5c'],
              [30, '#fd8d3c'],
              [40, '#f03b20'],
              [50, '#bd0026'],
              [60, '#800026']
            ]
          },

          'circle-stroke-color': 'white',
          'circle-stroke-width': 1,

          'circle-opacity': {
            stops: [
              [14, 0],
              [15, 1]
            ]
          }
        }
      });

      // Step 1.6: DBH popup.
      map.on('click', 'trees-point', (event) => {
        new mapboxgl.Popup()
          .setLngLat(event.features[0].geometry.coordinates)
          .setHTML(
            `<strong>DBH:</strong> ${event.features[0].properties.dbh}`
          )
          .addTo(map);
      });
    });
  </script>
</body>
</html>
